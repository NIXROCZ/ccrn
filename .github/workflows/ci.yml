# Runs the same three checks a contributor runs locally, on every push and
# pull request. Before this existed, nothing verified a push: the repository
# has no other automation, and Workers Builds deploys straight from the branch,
# so a broken commit reached customers before anyone knew.
name: CI

# A pull request from a branch in this repository fires both `push` and
# `pull_request`, which runs the whole job twice for one change. This repo is
# private, so that bills double the Actions minutes for no extra signal. Pushes are
# therefore watched only on the branches that deploy; every other branch is
# covered by its pull request.
on:
  push:
    branches:
      - 'devin/**'   # the current default branch
      - main
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches the Node that Workers Builds runs, and the @types/node major.
          node-version: '22'
          cache: npm

      # `npm ci` over `npm install`: it installs exactly the lockfile and fails
      # if package.json and the lock have drifted, which is a real failure worth
      # catching rather than silently resolving.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The build also runs sync-catalogue and write-headers, so this catches a
      # broken catalogue or a CSP that no longer matches the generated file —
      # neither of which lint or the unit tests would notice.
      - name: Build
        run: npm run build

      # The Content-Security-Policy is generated into src/lib/security-headers.ts
      # and public/_headers by scripts/write-headers.mjs. A hand edit to either
      # is overwritten by the next build, so committing one means the repository
      # says one thing and the deployed site serves another. The build above has
      # just regenerated both; if they now differ from what was committed, the
      # committed version was hand-written. Verified by committing a hand-edited
      # X-Frame-Options and confirming this step fails.
      - name: Check generated files are in step
        run: |
          if [ -n "$(git status --porcelain src/lib/security-headers.ts public/_headers)" ]; then
            echo "::error::The build regenerated security-headers.ts or _headers."
            echo "These are generated by scripts/write-headers.mjs. Run 'npm run build' and commit the result."
            git --no-pager diff -- src/lib/security-headers.ts public/_headers
            exit 1
          fi

  # ── Keeping the live site in step with this branch ───────────────────────
  #
  # Needs `check`, so a commit that fails lint, tests or the build can never
  # reach the site. Runs only on a real push to the deploying branch, never on
  # a pull request, and never from a fork.
  #
  # Deploys the PREVIEW environment, because that is what serves
  # raising-noble-preview.<subdomain>.workers.dev — the URL currently being
  # shared. The production block below goes live when the custom domain is
  # attached; until then a production Worker would be a second copy nobody
  # visits, pointing emails at a domain that does not resolve yet.
  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/devin/1788603912.51045-raising-noble-site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # Never let two deploys race. A queued one waits rather than being
      # cancelled, so the newest commit is always what ends up live.
      group: deploy-cloudflare
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Without a token there is nothing to deploy with. Skip with a notice
      # rather than failing: a red tick on every push would train everyone to
      # ignore it, and the checks above have already done their job.
      - name: Is deployment configured?
        id: configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions, and this push will deploy itself."
          fi

      # The build reads R2 to decide which kits are on sale, so the same
      # credentials are needed here, not only at deploy time.
      - name: Build
        if: steps.configured.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run build

      # Idempotent: applies only migrations the database has not seen. Runs
      # before the deploy so new code never meets an older schema.
      - name: Apply database migrations
        if: steps.configured.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply raising-noble --remote --env preview

      - name: Deploy
        if: steps.configured.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env preview

      # When raisingnoble.com is attached to the production Worker, change the
      # two steps above from `--env preview` to `--env=""`, or add them again
      # alongside so both stay current. Secrets are per-environment in
      # Cloudflare, so set them for production too before switching.

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.configured.outputs.ready }}" = "true" ]; then
            echo "Deployed ${{ github.sha }} to the preview Worker." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Deploy skipped — Cloudflare secrets are not set on this repository." >> "$GITHUB_STEP_SUMMARY"
          fi
